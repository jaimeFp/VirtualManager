[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualmanager-agent"
version = "0.1.0"
description = "VirtualManager agent for VirtualBox hosts"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
