services:
  postgres:
    image: postgres:17
    container_name: virtualmanager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: virtualmanager
      POSTGRES_USER: virtualmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: